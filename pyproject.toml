[build-system]
requires = [
    "setuptools>=42",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "mace_jax"
description = "MACE in JAX/Flax."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "MIT.md"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dynamic = ["version"]
dependencies = [
    "chex",
    "optax",
    "e3nn_jax",
    "e3nn==0.4.4",
    "numpy",
    "ase",
    "matscipy",
    "roundmantissa",
    "jraph",
    "jax>=0.4.23",
    "flax",
    "cuequivariance",
    "cuequivariance-jax",
    "gin-config",
    "unique_names_generator",
    "tqdm",
    "h5py",
    "configargparse",
    "pyyaml",
]

[project.optional-dependencies]
gpu = [
    "jax[cuda12] ; sys_platform == 'linux'",
    "cuequivariance-ops-cu12 ; sys_platform == 'linux'",
    "cuequivariance-ops-jax-cu12 ; sys_platform == 'linux'",
]
torch = [
    "torch",
    "cuequivariance-torch",
    # cuequivariance-ops-torch is not on PyPI; install manually from the
    # NVIDIA CUDA pip index when needed:
    #   uv pip install --extra-index-url https://pypi.nvidia.com cuequivariance-ops-torch
]
test = [
    "pytest",
    "pytest-xdist",
    "nox",
]
plot = [
    "matplotlib",
    "pandas",
]
wandb = [
    "wandb",
]
data = [
    "pymatgen",
]
lammps = [
    "lammps",
]
jax-cuda12 = [
    "jax[cuda12] ; sys_platform == 'linux'",
]

[project.scripts]
mace-jax-hdf5-benchmark = "mace_jax.cli.mace_jax_hdf5_benchmark:main"
mace-jax-from-torch = "mace_jax.cli.mace_jax_from_torch:main"
mace-create-lammps-model = "mace_jax.cli.mace_jax_create_lammps_model:main"
mace-jax-hdf5-info = "mace_jax.cli.mace_jax_hdf5_info:main"
mace-jax-preprocess = "mace_jax.cli.mace_jax_preprocess:main"
mace-jax-predict = "mace_jax.cli.mace_jax_predict:main"
mace-jax-train = "mace_jax.cli.mace_jax_train:main"
mace-jax-train-plot = "mace_jax.cli.mace_jax_train_plot:main"

[tool.uv]
# Limit universal resolution to the platforms the project actually targets;
# cuequivariance-ops-torch wheels are not published for Windows.
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

[tool.setuptools]
packages = {find = {}}

[tool.setuptools.dynamic]
version = {attr = "mace_jax.__version__"}

# Make isort compatible with black
[tool.isort]
profile = "black"

# Pylint
[tool.pylint.'MESSAGES CONTROL']
disable = [
    "line-too-long",
    "no-member",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-many-arguments",
    "too-many-locals",
    "not-callable",
    "logging-fstring-interpolation",
    "logging-not-lazy",
    "invalid-name",
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-statements",
    "too-many-branches",
    "import-outside-toplevel",
    "duplicate-code",
]

[tool.pylint.MASTER]
ignore-paths = [
]

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "PL", # pylint
    "F", # Pyflakes
    "UP", # pyupgrade
    "I", # isort
]
ignore = [
    "F401", # Module imported but unused
    "E501", # Line too long ({width} > {limit} characters)
    "E701", # Multiple statements on one line (colon)
    "E731", # Do not assign a lambda expression, use a def
    "E402",  # Module level import not at top of file
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments in function definition
    "PLR0915", # Too many statements
    "PLR2004", # Magic value used instead of constant
    "PLW0603", # Using the global statement
    "PLW2901", # redefined-loop-name
    "PLR1714", # consider-using-in
    "PLR5501", # else-if-used
]
fixable = ["ALL"]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
# this is entirely optional, you can remove this if you wish to
[tool.ruff.format]
# use single quotes for strings.
quote-style = "single"
# indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: marks tests that require extended runtime",
]
filterwarnings = [
    "ignore:Creating NamedTuple classes using keyword arguments is deprecated.*:DeprecationWarning",
    "ignore:`use_fallback` is deprecated.*:DeprecationWarning:cuequivariance",
    "ignore:The TorchScript type system doesn't support instance-level annotations.*:UserWarning:torch",
    "ignore:No artists with labels found to put in legend.*:UserWarning:matplotlib",
    "ignore:.*TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD.*:UserWarning:torch",
    "ignore:.*TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD.*:UserWarning:e3nn",
]
testpaths = ["tests"]
